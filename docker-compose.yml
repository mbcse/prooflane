services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openagents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openagents"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/openagents
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-long-random-string}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      ZERO_G_EVM_RPC: ${ZERO_G_EVM_RPC:-}
      ZERO_G_INDEXER_RPC: ${ZERO_G_INDEXER_RPC:-}
      ZERO_G_STORAGE_PRIVATE_KEY: ${ZERO_G_STORAGE_PRIVATE_KEY:-}
      OG_ROUTER_API_KEY: ${OG_ROUTER_API_KEY:-}
      OG_ROUTER_BASE_URL: ${OG_ROUTER_BASE_URL:-https://router-api-testnet.integratenetwork.work/v1}
      OG_ROUTER_MODEL: ${OG_ROUTER_MODEL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
